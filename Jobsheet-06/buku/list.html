<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini - Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="shortcut icon" href="#">
</head>
<body>

    <!-- Header & Navigasi Utama -->
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>

    <!-- Konten Utama -->
    <main>
        <section>
            <h2>Daftar Buku</h2>
            <div class="search-box">
                <label for="search-input">Cari Buku</label>
                <input type="text" id="search-input" placeholder="Ketik judul buku...">
            </div>

            <p id="table-counter" style="margin-bottom: 1rem; font-weight: 600; color: #55677a;"></p>
            <p id="loading-indicator" style="display:none;">Memuat data...</p>

            <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Judul</th>
                        <th>Pengarang</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SIMPUS-Mini - Sistem Informasi Perpustakaan Mini</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>

</body>
</html>
