<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini - Tambah Buku</title>
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="shortcut icon" href="#">
</head>
<body>

    <!-- Header & Navigasi Utama -->
    <header>
        <h1>SIMPUS-Mini</h1>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        

        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="buku_list.html">Daftar Buku</a></li>
                <li><a href="anggota_list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
         <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    </header>

    <!-- Konten Utama -->
    <main>
        <section>
            <h2>Tambah Buku Baru</h2>

            <!-- Form Tambah Buku -->
            <form id="form-tambah" novalidate>
                <p>
                    <label for="judul">Judul</label><br>
                    <input type="text" id="judul" name="judul" required>
                </p>

                <p>
                    <label for="pengarang">Pengarang</label><br>
                    <input type="text" id="pengarang" name="pengarang" required>
                </p>

                <p>
                    <label for="tahun">Tahun Terbit</label><br>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
                </p>

                <p>
                    <label for="isbn">ISBN</label><br>
                    <input type="text" id="isbn" name="isbn">
                </p>

                <p>
                    <label for="stok">Stok</label><br>
                    <input type="number" id="stok" name="stok" min="0" required>
                </p>

                <p>
                    <label for="kategori">Kategori</label><br>
                    <select id="kategori" name="kategori" required>
                        <option value="">Pilih Kategori</option>
                        <option value="Fiksi">Fiksi</option>
                        <option value="Non-Fiksi">Non-Fiksi</option>
                        <option value="Referensi">Referensi</option>
                    </select>
                </p>

                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SIMPUS-Mini - Sistem Informasi Perpustakaan Mini</p>
    </footer>
    <!-- Menghubungkan ke JavaScript -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
